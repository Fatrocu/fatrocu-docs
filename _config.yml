title: Fatrocu Wiki
description: Setup, document review and automation for Fatrocu 3.1
url: https://fatrocu.github.io
baseurl: /fatrocu-docs
repository: Fatrocu/fatrocu-docs
remote_theme: just-the-docs/just-the-docs@v0.12.0
lang: en
permalink: pretty

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - LICENSE
  - scripts
  - .github
  - .gitignore
  - .gitattributes
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - vendor

search_enabled: true
search:
  heading_level: 2
  previews: 3
  rel_url: true
heading_anchors: true
enable_copy_code_button: true
nav_enabled: true
color_scheme: light
back_to_top: true
back_to_top_text: Back to top
footer_content: "Fatrocu 3.1 beta documentation. Private extraction accuracy validation is pending."
gh_edit_link: true
gh_edit_link_text: View source on GitHub
gh_edit_repository: https://github.com/Fatrocu/fatrocu-docs
gh_edit_branch: codex/publish-docs-wiki
gh_edit_view_mode: tree

aux_links:
  "Source repository":
    - https://github.com/Fatrocu/fatrocu-docs
  "Beta downloads":
    - https://github.com/Fatrocu/Fatrocu/releases/tag/3.1.0-beta.1
