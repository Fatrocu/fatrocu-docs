name: Documentation checks
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_docs.py
      - name: Build the actual wiki with the GitHub Pages Jekyll runtime
        uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-site
          path: _site/
          if-no-files-found: error
# Indexing and publication are deliberate steps after reviewed main promotion.
